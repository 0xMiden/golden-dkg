[package]
name = "bulletproofs-cycle"
version = "0.1.1"
description = "Bulletproofs R1CS over configurable curve cycles"
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
publish = ["crates-io"]

[dependencies]
curve25519-dalek = { workspace = true, optional = true }
ff = { workspace = true }
group = { workspace = true }
merlin = { workspace = true }
p3-maybe-rayon = { workspace = true }
rand_core = { workspace = true }
sha3 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
digest = { version = "0.10", default-features = false }

[dev-dependencies]
bulletproofs = { workspace = true }
criterion = "0.5"
curve25519-dalek = { workspace = true }
halo2curves = { workspace = true, features = ["std"] }
rand_chacha = { workspace = true }

[features]
default = ["cycle-pedersen"]
cycle-pedersen = []
parallel = ["p3-maybe-rayon/parallel"]
bulletproofs-compat = ["ristretto", "curve25519-dalek/digest"]
ristretto = ["dep:curve25519-dalek", "curve25519-dalek/group", "curve25519-dalek/rand_core", "curve25519-dalek/alloc"]

[[test]]
name = "ristretto_smoke"
required-features = ["cycle-pedersen", "ristretto"]

[[test]]
name = "ristretto_parity"
required-features = ["cycle-pedersen", "ristretto"]

[[test]]
name = "r1cs_batch"
required-features = ["cycle-pedersen", "ristretto"]

[[bench]]
name = "generators"
harness = false
required-features = ["cycle-pedersen"]

[[bench]]
name = "inner_product_proof"
harness = false
required-features = ["cycle-pedersen"]

[[bench]]
name = "linear_proof"
harness = false
required-features = ["cycle-pedersen"]

[[bench]]
name = "r1cs"
harness = false
required-features = ["cycle-pedersen"]

[lints]
workspace = true
