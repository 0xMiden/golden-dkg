[package]
name = "golden-core"
version.workspace = true
description = "Core traits and protocols for Golden distributed key generation"
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
publish = ["crates-io"]

[dependencies]
ff = { workspace = true }
group = { workspace = true }
miden-serde-utils = { workspace = true, optional = true }
rand_core = { workspace = true }
serde = { workspace = true, optional = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
ff = { workspace = true, features = ["derive"] }
golden-curves = { workspace = true, features = ["secp256k1", "jubjub"] }
rand_chacha = { workspace = true }
serde_test = { workspace = true }

[features]
default = []
insecure-revealed-witness = []
miden-serde = ["dep:miden-serde-utils"]
serde = ["dep:serde"]

[lints]
workspace = true
