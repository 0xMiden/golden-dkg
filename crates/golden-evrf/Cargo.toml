[package]
name = "golden-evrf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
golden-core = { workspace = true }
rand_core = { workspace = true }
sha2 = { workspace = true }
bulletproofs-cycle = { workspace = true, optional = true }
golden-halo2curves = { workspace = true, optional = true }
ff = { workspace = true, optional = true }
group = { workspace = true, optional = true }
halo2curves = { workspace = true, optional = true }
merlin = { workspace = true }
miden-serde-utils = { workspace = true, optional = true }
rand_chacha = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
ff = { workspace = true }
golden-rustcrypto = { path = "../golden-rustcrypto", features = ["p256"] }
rand_chacha = { workspace = true }
serde_test = { workspace = true }

[features]
default = []
miden-serde = ["dep:miden-serde-utils", "golden-core/miden-serde"]
serde = ["dep:serde", "golden-core/serde"]
halo2curves-secp256k1 = [
    "dep:bulletproofs-cycle",
    "dep:golden-halo2curves",
    "dep:ff",
    "dep:group",
    "dep:halo2curves",
    "dep:rand_chacha",
    "golden-halo2curves/halo2curves-secp256k1",
]

[[test]]
name = "one_receiver"
required-features = ["halo2curves-secp256k1"]

[[test]]
name = "batched_dealer"
required-features = ["halo2curves-secp256k1"]

[[test]]
name = "dkg_integration"
required-features = ["halo2curves-secp256k1"]

[[test]]
name = "paper_public_api"
required-features = ["halo2curves-secp256k1"]

[lints]
workspace = true
