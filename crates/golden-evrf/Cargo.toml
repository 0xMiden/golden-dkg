[package]
name = "golden-evrf"
version = "0.4.0"
description = "Verifiable random function proof backends for Golden distributed key generation"
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
publish = ["crates-io"]

[dependencies]
golden-core = { workspace = true }
rand_core = { workspace = true }
sha2 = { workspace = true }
bls12_381 = { workspace = true, optional = true }
bulletproofs-cycle = { workspace = true, optional = true }
golden-bls-jubjub = { workspace = true, optional = true }
golden-halo2curves = { workspace = true, optional = true }
ff = { workspace = true, optional = true }
group = { workspace = true, optional = true }
halo2curves = { workspace = true, optional = true }
jubjub = { workspace = true, optional = true }
merlin = { workspace = true }
p3-maybe-rayon = { workspace = true, optional = true }
rand_chacha = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["derive"] }

[dev-dependencies]
bulletproofs-cycle = { workspace = true }
codspeed-criterion-compat = "5.0.1"
criterion = "0.5"
ff = { workspace = true }
golden-rustcrypto = { workspace = true, features = ["p256"] }
postcard = { workspace = true }
rand_chacha = { workspace = true }

[features]
default = []
miden-serde = ["golden-core/miden-serde"]
parallel = ["bulletproofs-cycle?/parallel", "golden-core/parallel", "p3-maybe-rayon?/parallel"]
serde = [
    "dep:serde",
    "bulletproofs-cycle?/serde",
    "golden-core/serde",
    "halo2curves?/derive_serde",
]
halo2curves-secp256k1 = [
    "dep:bulletproofs-cycle",
    "dep:golden-halo2curves",
    "dep:ff",
    "dep:group",
    "dep:halo2curves",
    "dep:p3-maybe-rayon",
    "dep:rand_chacha",
    "golden-halo2curves/halo2curves-secp256k1",
]
bls12-381-jubjub = [
    "dep:bls12_381",
    "dep:bulletproofs-cycle",
    "dep:golden-bls-jubjub",
    "dep:ff",
    "dep:group",
    "dep:jubjub",
    "dep:p3-maybe-rayon",
    "dep:rand_chacha",
]

[[test]]
name = "one_receiver"
required-features = ["halo2curves-secp256k1"]

[[test]]
name = "batched_dealer"
required-features = ["halo2curves-secp256k1"]

[[test]]
name = "dkg_integration"
required-features = ["halo2curves-secp256k1"]

[[test]]
name = "paper_public_api"
required-features = ["halo2curves-secp256k1"]

[[test]]
name = "public_params_serde"
required-features = ["halo2curves-secp256k1", "serde"]

[[test]]
name = "bls_dkg_integration"
required-features = ["bls12-381-jubjub"]

[[test]]
name = "bls_paper_public_api"
required-features = ["bls12-381-jubjub"]

[[bench]]
name = "evrf_prove"
harness = false
required-features = ["halo2curves-secp256k1", "parallel"]

[[bench]]
name = "evrf_verify"
harness = false
required-features = ["halo2curves-secp256k1", "parallel"]

[[bench]]
name = "evrf_proof_size"
harness = false
required-features = ["halo2curves-secp256k1"]

[[bench]]
name = "dkg_round"
harness = false
required-features = ["halo2curves-secp256k1", "parallel"]

[[bench]]
name = "dkg_communication"
harness = false
required-features = ["halo2curves-secp256k1"]

[[bench]]
name = "batched_setup"
harness = false
required-features = ["halo2curves-secp256k1", "parallel"]

[[bench]]
name = "bls_evrf_prove"
harness = false
required-features = ["bls12-381-jubjub", "parallel"]

[[bench]]
name = "bls_evrf_verify"
harness = false
required-features = ["bls12-381-jubjub", "parallel"]

[[bench]]
name = "bls_evrf_proof_size"
harness = false
required-features = ["bls12-381-jubjub"]

[[bench]]
name = "bls_dkg_round"
harness = false
required-features = ["bls12-381-jubjub", "parallel"]

[[bench]]
name = "bls_dkg_communication"
harness = false
required-features = ["bls12-381-jubjub"]

[[bench]]
name = "bls_batched_setup"
harness = false
required-features = ["bls12-381-jubjub", "parallel"]

[[example]]
name = "warm_bench_fixtures"
required-features = ["halo2curves-secp256k1", "parallel"]

[[example]]
name = "check_bench_fixtures"
required-features = ["halo2curves-secp256k1", "parallel"]

[[example]]
name = "warm_bench_fixtures_bls"
required-features = ["bls12-381-jubjub", "parallel"]

[[example]]
name = "check_bench_fixtures_bls"
required-features = ["bls12-381-jubjub", "parallel"]

[lints]
workspace = true
