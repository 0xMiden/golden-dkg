[package]
name = "golden-bls-jubjub"
version = "0.4.0"
description = "BLS12-381/Jubjub curve adapters for Golden distributed key generation"
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
publish = ["crates-io"]

[dependencies]
bls12_381 = { workspace = true }
blst = { workspace = true }
blstrs = { workspace = true }
bulletproofs-cycle = { workspace = true }
ff = { workspace = true }
golden-core = { workspace = true }
group = { workspace = true }
jubjub = { workspace = true }
rand_core = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }

[dev-dependencies]
criterion = "0.5"
rand_chacha = { workspace = true }

[[bench]]
name = "bls_msm"
harness = false

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
panic = "deny"
