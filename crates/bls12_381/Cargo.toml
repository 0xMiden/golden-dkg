[package]
name = "bls12_381"
version = "0.8.0"
authors = ["Sean Bowe <ewillbefull@gmail.com>", "Jack Grigg <thestr4d@gmail.com>"]
description = "Implementation of the BLS12-381 pairing-friendly elliptic curve construction"
homepage = "https://github.com/zkcrypto/bls12_381"
license = "MIT/Apache-2.0"
repository = "https://github.com/zkcrypto/bls12_381"
edition = "2021"
publish = false

[dependencies]
ff = { workspace = true }
group = { workspace = true, optional = true }
pairing = { version = "0.23", optional = true }
rand_core = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true, optional = true }

[features]
default = ["groups", "pairings", "alloc", "bits"]
bits = ["ff/bits"]
groups = ["group"]
pairings = ["groups", "pairing", "alloc"]
alloc = ["group/alloc"]
nightly = ["subtle/nightly"]
std = []
