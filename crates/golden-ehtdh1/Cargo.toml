[package]
name = "golden-ehtdh1"
version = "0.2.0"
description = "Context bound threshold encryption for Golden distributed key generation"
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
publish = ["crates-io"]

[dependencies]
chacha20 = { workspace = true }
golden-core = { workspace = true }
hkdf = { workspace = true }
miden-serde-utils = { workspace = true, optional = true }
rand_core = { workspace = true }
serde = { workspace = true, optional = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
chacha20poly1305 = { workspace = true }
golden-evrf = { workspace = true, features = ["halo2curves-secp256k1"] }
golden-halo2curves = { workspace = true, features = ["halo2curves-secp256k1"] }
golden-rustcrypto = { workspace = true, features = ["p256"] }
rand_chacha = { workspace = true }
serde_test = { workspace = true }

[features]
default = []
miden-serde = ["dep:miden-serde-utils", "golden-core/miden-serde"]
prototype-bridge = []
halo2curves-secp256k1 = []
serde = ["dep:serde", "golden-core/serde"]

[[example]]
name = "threshold_records"
required-features = ["prototype-bridge"]

[lints]
workspace = true
