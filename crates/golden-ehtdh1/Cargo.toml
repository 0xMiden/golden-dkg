[package]
name = "golden-ehtdh1"
version.workspace = true
description = "Context bound threshold encryption for Golden distributed key generation"
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
publish = ["crates-io"]

[dependencies]
chacha20 = { workspace = true }
golden-core = { workspace = true }
ff = { workspace = true }
group = { workspace = true }
hkdf = { workspace = true }
miden-serde-utils = { workspace = true, optional = true }
rand_core = { workspace = true }
serde = { workspace = true, optional = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
chacha20poly1305 = { workspace = true }
golden-core = { workspace = true, features = ["insecure-revealed-witness"] }
golden-curves = { workspace = true, features = ["secp256k1", "jubjub"] }
golden-bulletproofs = { workspace = true, features = ["secp-secq", "jubjub-bls12-381"] }
rand_chacha = { workspace = true }
postcard = { workspace = true }

[features]
default = []
miden-serde = ["dep:miden-serde-utils", "golden-core/miden-serde"]
serde = ["dep:serde", "golden-core/serde"]

[lints]
workspace = true
