[package]
name = "golden-rustcrypto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
golden-core = { workspace = true }
k256 = { workspace = true, default-features = false, features = ["arithmetic", "hash2curve"], optional = true }
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "hash2curve"], optional = true }
rand_core = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }

[features]
default = []
p256 = ["dep:p256"]
k256 = ["dep:k256"]

[dev-dependencies]
hex = { workspace = true }
rand_chacha = { workspace = true }

[lints]
workspace = true
