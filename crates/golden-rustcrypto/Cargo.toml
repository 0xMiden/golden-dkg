[package]
name = "golden-rustcrypto"
version = "0.5.0"
description = "RustCrypto group adapters for Golden distributed key generation"
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
publish = ["crates-io"]

[dependencies]
golden-core = { workspace = true }
k256 = { workspace = true, default-features = false, features = ["arithmetic", "group-digest"], optional = true }
p256 = { version = "0.14", default-features = false, features = ["arithmetic", "group-digest"], optional = true }
rand_core = { workspace = true }
rand_core_10 = { package = "rand_core", version = "0.10", optional = true }
subtle = { workspace = true }
zeroize = { workspace = true }

[features]
default = []
p256 = ["dep:p256", "dep:rand_core_10"]
k256 = ["dep:k256", "dep:rand_core_10"]

[dev-dependencies]
hex = { workspace = true }
rand_chacha = { workspace = true }

[lints]
workspace = true
