# cargo-deny configuration for the Golden workspace

[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
  # paste is unmaintained but still functional and is used transitively.
  "RUSTSEC-2024-0436",
]
yanked = "warn"

[licenses]
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "MIT",
  "Unicode-3.0",
]
exceptions = []

[bans]
allow = []
deny = []
highlight = "all"
multiple-versions = "deny"
skip = [
  # halo2derive still depends on syn 1.
  { name = "syn", version = "=1.0.109" },
  # RustCrypto 0.14 uses the newer field, RNG, and digest traits. The other
  # curve and symmetric-crypto dependencies still require these older versions.
  { name = "block-buffer", version = "=0.10.4" },
  { name = "cpufeatures", version = "=0.2.17" },
  { name = "crypto-common", version = "=0.1.6" },
  { name = "digest", version = "=0.10.7" },
  { name = "ff", version = "=0.13.1" },
  { name = "group", version = "=0.13.0" },
  { name = "rand_core", version = "=0.6.4" },
  { name = "sha2", version = "=0.10.9" },
]
skip-tree = []
wildcards = "allow"

[sources]
allow-git = []
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
unknown-git = "deny"
unknown-registry = "deny"
