[workspace]
members = [
    "crates/bulletproofs-cycle",
    "crates/golden-bls-jubjub",
    "crates/golden-core",
    "crates/golden-ehtdh1",
    "crates/golden-evrf",
    "crates/golden-halo2curves",
    "crates/golden-rustcrypto",
]
resolver = "2"

[profile.optimized]
inherits = "release"
lto = "thin"
codegen-units = 1

[workspace.package]
edition = "2021"
homepage = "https://miden.xyz"
license = "MIT OR Apache-2.0"
repository = "https://github.com/0xMiden/golden-dkg"
rust-version = "1.93"

[workspace.dependencies]
bls12_381 = { version = "0.8", default-features = false, features = ["groups", "bits", "alloc"] }
blst = { version = "0.3", default-features = false }
blstrs = { version = "0.7", default-features = false }
bulletproofs = { version = "5.0.0", default-features = false }
bulletproofs-cycle = { path = "crates/bulletproofs-cycle", version = "0.4.0" }
chacha20 = "0.9"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
curve25519-dalek = { version = "4.1.3", default-features = false }
ff = { version = "0.13", default-features = false }
group = { version = "0.13", default-features = false }
golden-bls-jubjub = { path = "crates/golden-bls-jubjub", version = "0.4.0" }
golden-core = { path = "crates/golden-core", version = "0.4.0" }
golden-evrf = { path = "crates/golden-evrf", version = "0.4.0" }
golden-halo2curves = { path = "crates/golden-halo2curves", version = "0.4.0" }
golden-rustcrypto = { path = "crates/golden-rustcrypto", version = "0.4.0" }
halo2curves = { version = "0.10", default-features = false }
hex = "0.4"
hkdf = "0.12"
jubjub = { version = "0.10", default-features = false, features = ["bits", "alloc"] }
k256 = { version = "0.13", default-features = false }
merlin = { version = "3", default-features = false }
miden-serde-utils = { version = "0.28", default-features = false }
p3-maybe-rayon = { version = "0.6.2", default-features = false }
postcard = { version = "1", default-features = false, features = ["alloc"] }
rand_chacha = "0.3"
rand_core = "0.6"
serde = { version = "1", default-features = false, features = ["alloc"] }
serde_test = "1"
sha2 = "0.10"
sha3 = { version = "0.10", default-features = false }
smallvec = "1"
subtle = "2.6"
thiserror = "2"
zeroize = "1.8"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
panic = "deny"
