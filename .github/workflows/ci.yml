name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Clippy (workspace, all features, exclude bulletproofs-cycle)
        run: cargo clippy --all --benches --tests --examples --all-features --exclude bulletproofs-cycle -- -D warnings
      - name: Clippy bulletproofs-cycle (cycle-pedersen default)
        run: cargo clippy -p bulletproofs-cycle --benches --tests -- -D warnings
      - name: Clippy bulletproofs-cycle (bulletproofs-compat)
        run: cargo clippy -p bulletproofs-cycle --benches --tests --no-default-features --features bulletproofs-compat -- -D warnings

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2
        with:
          tool: cargo-hack
      - name: Check workspace (default features)
        run: cargo check --all-targets --workspace
      - name: Check each feature combination
        # `bulletproofs-compat` is mutually exclusive with `cycle-pedersen`
        # (the default), so it is excluded from the matrix and exercised
        # separately in the test job.
        run: |
          cargo hack check \
            --workspace \
            --each-feature \
            --exclude-features default,bulletproofs-compat \
            --all-targets
      - name: golden-core dependency boundary
        run: |
          cargo tree -p golden-core > /tmp/golden-core-tree.txt
          ! grep -E '(^|[[:space:]])(p256|k256|ark-|bls|frost|pairing)' /tmp/golden-core-tree.txt

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2
        with:
          tool: cargo-nextest
      - name: Test golden-core
        run: cargo nextest run -p golden-core
      - name: Test golden-core wire serialization adapters
        run: cargo nextest run -p golden-core --features serde,miden-serde
      - name: Test P-256 backend
        run: cargo nextest run -p golden-rustcrypto --features p256
      - name: Test K-256 backend
        run: cargo nextest run -p golden-rustcrypto --features k256
      - name: Test eVRF proof backend
        run: cargo nextest run -p golden-evrf --features golden-rustcrypto/p256
      - name: Test EHTDH1 prototype bridge
        run: cargo nextest run -p golden-ehtdh1 --features prototype-bridge
      - name: Test Secp/Secq R1CS cycle
        run: cargo nextest run -p golden-halo2curves --features halo2curves-secp256k1
      - name: Test Ristretto Cycle impl and upstream byte parity
        run: cargo nextest run -p bulletproofs-cycle --features ristretto
      - name: Test bulletproofs-compat (upstream domain separation)
        run: cargo nextest run -p bulletproofs-cycle --no-default-features --features bulletproofs-compat
      - name: Test golden-evrf Secp/Secq backend
        run: cargo nextest run -p golden-evrf --features halo2curves-secp256k1
      - name: Test golden-evrf wire serialization adapters
        run: cargo nextest run -p golden-evrf --features serde,miden-serde,halo2curves-secp256k1
      - name: Doctests
        run: cargo test --workspace --doc

  doc:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Build documentation (workspace, default features, exclude bulletproofs-cycle)
        run: cargo doc --no-deps --workspace --exclude bulletproofs-cycle
      - name: Build documentation (golden-rustcrypto p256+k256)
        run: cargo doc --no-deps -p golden-rustcrypto --features p256,k256
      - name: Build documentation (golden-evrf halo2curves backend)
        run: cargo doc --no-deps -p golden-evrf --features halo2curves-secp256k1
      - name: Build bulletproofs-cycle docs (cycle-pedersen default)
        run: cargo doc --no-deps -p bulletproofs-cycle
      - name: Build bulletproofs-cycle docs (bulletproofs-compat)
        run: cargo doc --no-deps -p bulletproofs-cycle --no-default-features --features bulletproofs-compat
