name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
          rustup default stable
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Clippy (workspace, all features, exclude bulletproofs-cycle)
        run: cargo clippy --all --benches --tests --examples --all-features --exclude bulletproofs-cycle -- -D warnings
      - name: Clippy bulletproofs-cycle (cycle-pedersen default)
        run: cargo clippy -p bulletproofs-cycle --benches --tests -- -D warnings
      - name: Clippy bulletproofs-cycle (bulletproofs-compat)
        run: cargo clippy -p bulletproofs-cycle --benches --tests --no-default-features --features bulletproofs-compat -- -D warnings

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2.82.5
        with:
          tool: cargo-hack
      - name: Check workspace (default features)
        run: cargo check --all-targets --workspace
      - name: Check each feature
        # `bulletproofs-compat` is mutually exclusive with `cycle-pedersen`
        # (the default), so it is excluded from the matrix and exercised
        # separately in the test job.
        run: |
          cargo hack check \
            --workspace \
            --each-feature \
            --exclude-features default,bulletproofs-compat \
            --all-targets
      - name: Compile EHTDH1 threshold record example
        run: cargo check -p golden-ehtdh1 --example threshold_records
      - name: Check browser recovery crates
        run: |
          cargo check \
            --target wasm32-unknown-unknown \
            --lib \
            -p golden-core \
            -p golden-ehtdh1 \
            -p golden-curves \
            --features golden-core/serde,golden-core/miden-serde,golden-ehtdh1/serde,golden-ehtdh1/miden-serde,golden-curves/secp256k1,golden-curves/jubjub
      - name: golden-core dependency boundary
        run: |
          cargo tree -p golden-core --edges normal,build --prefix none > /tmp/golden-core-tree.txt
          ! grep -E '^(golden-(curves|bulletproofs)|bulletproofs(-cycle)?|halo2curves|jubjub|bls12_381|blstrs|blst|p256|k256|ark-[^ ]*|frost[^ ]*|pairing)([[:space:]]|$)' /tmp/golden-core-tree.txt

  msrv:
    name: Rust 1.93
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install minimum supported Rust toolchain
        run: rustup toolchain install 1.93 --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: msrv-1.93
      - name: Check workspace on MSRV
        run: cargo +1.93 check --locked --workspace --all-targets
      - name: Check optional features on MSRV
        run: cargo +1.93 check --locked --workspace --all-targets --all-features --exclude bulletproofs-cycle
      - name: Check engine compatibility mode on MSRV
        run: cargo +1.93 check --locked -p bulletproofs-cycle --all-targets --no-default-features --features bulletproofs-compat,parallel,serde

  cargo-deny:
    name: Check dependencies with cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2.82.5
        with:
          tool: cargo-deny@0.19.6
          fallback: none
      - name: Check dependencies
        run: cargo deny check

  test:
    name: Test
    runs-on: warp-ubuntu-latest-x64-8x
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2.82.5
        with:
          tool: cargo-nextest
      - name: Test core workflow and persistence adapters
        run: cargo nextest run -p golden-core --features insecure-revealed-witness,serde,miden-serde
      - name: Test both native curve adapters
        run: cargo nextest run -p golden-curves --features secp256k1,jubjub
      - name: Test EHTDH1 online operations, bridge, and wire adapters
        run: cargo nextest run -p golden-ehtdh1 --features serde,miden-serde
      - name: Test engine (sequential)
        run: cargo nextest run -p bulletproofs-cycle --features ristretto,serde
      - name: Test engine (parallel)
        run: cargo nextest run -p bulletproofs-cycle --features ristretto,parallel,serde
      - name: Test bulletproofs-compat (upstream domain separation)
        run: cargo nextest run -p bulletproofs-cycle --no-default-features --features bulletproofs-compat,serde
      - name: Doctests
        run: cargo test --workspace --doc --exclude bulletproofs-cycle --all-features
      - name: Engine doctests (cycle-pedersen default)
        run: cargo test -p bulletproofs-cycle --doc --features ristretto,parallel,serde
      - name: Engine doctests (bulletproofs-compat)
        run: cargo test -p bulletproofs-cycle --doc --no-default-features --features bulletproofs-compat,serde

  backend-test:
    name: Test ${{ matrix.name }}
    runs-on: warp-ubuntu-latest-x64-8x
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Secp/Secq backend (sequential)
            key: secp-sequential
            features: secp-secq,serde
          - name: Secp/Secq backend (parallel)
            key: secp-parallel
            features: secp-secq,parallel,serde
          - name: BLS12-381/Jubjub backend (sequential)
            key: bls-sequential
            features: jubjub-bls12-381,serde
          - name: BLS12-381/Jubjub backend (parallel)
            key: bls-parallel
            features: jubjub-bls12-381,parallel,serde
    env:
      BACKEND_FEATURES: ${{ matrix.features }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.key }}
      - uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2.82.5
        with:
          tool: cargo-nextest
      - name: Test prepared joint proof backend
        run: cargo nextest run -p golden-bulletproofs --no-default-features --features "$BACKEND_FEATURES"

  fixture-check:
    name: Bench fixtures still valid
    runs-on: warp-ubuntu-latest-x64-8x
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Check both joint dealer-message fixture sets
        run: |
          cargo run --profile optimized -p golden-bulletproofs --example check_fixtures \
            --features secp-secq,jubjub-bls12-381,parallel

  doc:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build documentation (workspace, default features, exclude bulletproofs-cycle)
        run: cargo doc --no-deps --workspace --exclude bulletproofs-cycle
      - name: Build core documentation (workflow and persistence)
        run: cargo doc --no-deps -p golden-core --features insecure-revealed-witness,serde,miden-serde
      - name: Build native curve documentation (both groups)
        run: cargo doc --no-deps -p golden-curves --features secp256k1,jubjub
      - name: Build prepared proof documentation (both backends)
        run: cargo doc --no-deps -p golden-bulletproofs --features secp-secq,jubjub-bls12-381,parallel,serde
      - name: Build EHTDH1 documentation (wire adapters)
        run: cargo doc --no-deps -p golden-ehtdh1 --features serde,miden-serde
      - name: Build bulletproofs-cycle docs (cycle-pedersen default)
        run: cargo doc --no-deps -p bulletproofs-cycle --features ristretto,parallel,serde
      - name: Build bulletproofs-cycle docs (bulletproofs-compat)
        run: cargo doc --no-deps -p bulletproofs-cycle --no-default-features --features bulletproofs-compat,serde
