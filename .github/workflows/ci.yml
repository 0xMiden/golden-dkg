name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
          rustup default stable
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Clippy (workspace, all features, exclude bulletproofs-cycle)
        run: cargo clippy --all --benches --tests --examples --all-features --exclude bulletproofs-cycle -- -D warnings
      - name: Clippy bulletproofs-cycle (cycle-pedersen default)
        run: cargo clippy -p bulletproofs-cycle --benches --tests -- -D warnings
      - name: Clippy bulletproofs-cycle (bulletproofs-compat)
        run: cargo clippy -p bulletproofs-cycle --benches --tests --no-default-features --features bulletproofs-compat -- -D warnings

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2.82.5
        with:
          tool: cargo-hack
      - name: Check workspace (default features)
        run: cargo check --all-targets --workspace
      - name: Check each feature combination
        # `bulletproofs-compat` is mutually exclusive with `cycle-pedersen`
        # (the default), so it is excluded from the matrix and exercised
        # separately in the test job.
        run: |
          cargo hack check \
            --workspace \
            --each-feature \
            --exclude-features default,bulletproofs-compat \
            --all-targets
      - name: Compile EHTDH1 threshold record example
        run: cargo check -p golden-ehtdh1 --example threshold_records --features halo2curves-secp256k1
      - name: Check browser recovery crates
        run: |
          cargo check \
            --target wasm32-unknown-unknown \
            -p golden-core \
            -p golden-ehtdh1 \
            -p golden-halo2curves \
            --features golden-halo2curves/halo2curves-secp256k1
      - name: golden-core dependency boundary
        run: |
          cargo tree -p golden-core > /tmp/golden-core-tree.txt
          ! grep -E '(^|[[:space:]])(p256|k256|ark-|bls|frost|pairing)' /tmp/golden-core-tree.txt

  cargo-deny:
    name: Check dependencies with cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2.82.5
        with:
          tool: cargo-deny@0.19.6
          fallback: none
      - name: Check dependencies
        run: cargo deny check

  test:
    name: Test
    runs-on: warp-ubuntu-latest-x64-8x
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2.82.5
        with:
          tool: cargo-nextest
      - name: Test golden-core
        run: cargo nextest run -p golden-core
      - name: Test golden-core wire serialization adapters
        run: cargo nextest run -p golden-core --features serde,miden-serde
      - name: Test P-256 backend
        run: cargo nextest run -p golden-rustcrypto --features p256
      - name: Test K-256 backend
        run: cargo nextest run -p golden-rustcrypto --features k256
      - name: Test eVRF proof backend
        run: cargo nextest run -p golden-evrf --features golden-rustcrypto/p256
      - name: Test EHTDH1 Secp/Secq bridge
        run: cargo nextest run -p golden-ehtdh1 --features halo2curves-secp256k1
      - name: Test Secp/Secq R1CS cycle
        run: cargo nextest run -p golden-halo2curves --features halo2curves-secp256k1
      - name: Test bulletproofs-compat (upstream domain separation)
        run: cargo nextest run -p bulletproofs-cycle --no-default-features --features bulletproofs-compat
      - name: Test EHTDH1 wire serialization adapters
        run: cargo nextest run -p golden-ehtdh1 --features serde,miden-serde
      - name: Doctests
        run: cargo test --workspace --doc

  backend-test:
    name: Test Secp/Secq backend (${{ matrix.backend }})
    runs-on: warp-ubuntu-latest-x64-8x
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: sequential
            bulletproofs_features: ristretto
            evrf_features: serde,miden-serde,halo2curves-secp256k1
          - backend: parallel
            bulletproofs_features: ristretto,parallel
            evrf_features: halo2curves-secp256k1,parallel
    env:
      BULLETPROOFS_FEATURES: ${{ matrix.bulletproofs_features }}
      EVRF_FEATURES: ${{ matrix.evrf_features }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.backend }}
      - uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2.82.5
        with:
          tool: cargo-nextest
      - name: Test Ristretto generator backend
        run: cargo nextest run -p bulletproofs-cycle --features "$BULLETPROOFS_FEATURES"
      - name: Test golden-evrf Secp/Secq backend
        run: cargo nextest run -p golden-evrf --features "$EVRF_FEATURES"

  fixture-check:
    name: Bench fixtures still valid
    runs-on: warp-ubuntu-latest-x64-8x
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Check checked-in dealer-message fixtures still verify
        run: |
          cargo run --profile optimized --example check_bench_fixtures \
            --features golden-evrf/halo2curves-secp256k1,golden-evrf/parallel

  doc:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build documentation (workspace, default features, exclude bulletproofs-cycle)
        run: cargo doc --no-deps --workspace --exclude bulletproofs-cycle
      - name: Build documentation (golden-rustcrypto p256+k256)
        run: cargo doc --no-deps -p golden-rustcrypto --features p256,k256
      - name: Build documentation (golden-evrf halo2curves backend)
        run: cargo doc --no-deps -p golden-evrf --features halo2curves-secp256k1
      - name: Build bulletproofs-cycle docs (cycle-pedersen default)
        run: cargo doc --no-deps -p bulletproofs-cycle
      - name: Build bulletproofs-cycle docs (bulletproofs-compat)
        run: cargo doc --no-deps -p bulletproofs-cycle --no-default-features --features bulletproofs-compat
