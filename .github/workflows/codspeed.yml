name: CodSpeed

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  codspeed:
    name: Joint DKG (both backends)
    runs-on: codspeed-macro
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # CodSpeed uses OIDC to associate measurements with this repository.
    env:
      RAYON_NUM_THREADS: "8"
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cargo-codspeed
        run: cargo install cargo-codspeed --version 4.6.0 --locked

      - name: Build benchmark
        run: |
          set -euo pipefail
          cargo codspeed build \
            --measurement-mode walltime \
            --profile optimized \
            -p golden-bulletproofs \
            --features secp-secq,jubjub-bls12-381,parallel \
            --bench joint_dkg

      - name: Run benchmark
        uses: CodSpeedHQ/action@f22792bfac16f3e14eb9fbea76f4a48e9cc22b93 # v4.19.1
        with:
          mode: walltime
          run: |
            set -euo pipefail
            cargo codspeed run \
              --measurement-mode walltime \
              -p golden-bulletproofs \
              --bench joint_dkg
