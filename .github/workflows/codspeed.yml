name: CodSpeed

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  codspeed:
    name: ${{ matrix.name }}
    runs-on: codspeed-macro
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Paper Table 4 Secp256k1/Secq256k1 prover
            bench: evrf_prove
            timeout: 30
            table4_rows: "9"
            table5_rows: "10"
            table5_metric: split
          - name: Paper Table 4 Secp256k1/Secq256k1 verifiers
            bench: evrf_verify
            timeout: 60
            table4_rows: "9"
            table5_rows: "10"
            table5_metric: split
          - name: Paper Table 5 Secp256k1/Secq256k1 participant runtime
            bench: dkg_round
            timeout: 30
            table4_rows: "9"
            table5_rows: "10"
            table5_metric: total
          - name: Secp/Secq prepared-generator setup
            bench: batched_setup
            timeout: 15
    permissions:
      contents: read
      id-token: write # CodSpeed uses OIDC to associate measurements with this repository.
    env:
      BENCH_NAME: ${{ matrix.bench }}
      GOLDEN_TABLE4_NE_VALUES: ${{ matrix.table4_rows }}
      GOLDEN_TABLE5_N_VALUES: ${{ matrix.table5_rows }}
      GOLDEN_TABLE5_METRIC: ${{ matrix.table5_metric }}
      RAYON_NUM_THREADS: "8"
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cargo-codspeed
        run: cargo install cargo-codspeed --version 4.6.0 --locked

      - name: Build benchmark
        run: |
          set -euo pipefail
          cargo codspeed build \
            --measurement-mode walltime \
            --profile optimized \
            -p golden-evrf \
            --features halo2curves-secp256k1,parallel,serde \
            --bench "${BENCH_NAME}"

      - name: Run benchmark
        uses: CodSpeedHQ/action@f22792bfac16f3e14eb9fbea76f4a48e9cc22b93 # v4.19.1
        with:
          mode: walltime
          run: |
            set -euo pipefail
            cargo codspeed run \
              --measurement-mode walltime \
              -p golden-evrf \
              --bench "${BENCH_NAME}"
