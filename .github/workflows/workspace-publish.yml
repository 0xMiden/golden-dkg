name: Publish workspace to crates.io

# Keep this filename stable. crates.io trusted publishing binds the publisher
# to this workflow and the release environment.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to publish. It must resolve to the current main commit."
        required: true
        default: main
        type: string
      packages:
        description: "Comma, space, or newline separated packages. Empty publishes all publishable workspace packages."
        required: false
        default: ""
        type: string
      allow_existing:
        description: "Exclude versions already on crates.io. Use only to resume a partial publication."
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: workspace-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish workspace crates
    if: ${{ github.repository_owner == '0xMiden' }}
    runs-on: ubuntu-latest
    environment: release
    env:
      RUSTUP_TOOLCHAIN: "1.93"
    permissions:
      contents: read
      id-token: write # Required for crates.io trusted publishing.

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: Verify release commit
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --depth=1
          main_sha="$(git rev-parse FETCH_HEAD)"
          release_sha="$(git rev-parse HEAD)"

          echo "main_sha=$main_sha"
          echo "release_sha=$release_sha"

          if [[ "$main_sha" != "$release_sha" ]]; then
            echo "::error::The release commit does not match origin/main."
            exit 1
          fi
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish workspace crates
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          RELEASE_ALLOW_EXISTING: ${{ inputs.allow_existing }}
          RELEASE_PACKAGES: ${{ inputs.packages || '' }}
        run: |
          set -euo pipefail

          case "$RELEASE_ALLOW_EXISTING" in
            true | false) ;;
            *)
              echo "error: invalid allow_existing value '$RELEASE_ALLOW_EXISTING'" >&2
              exit 2
              ;;
          esac

          metadata_json="$(cargo metadata --locked --no-deps --format-version 1)"
          selected_packages=()

          add_packages() {
            local line word
            while IFS= read -r line; do
              line="${line%%#*}"
              line="${line//,/ }"
              for word in $line; do
                selected_packages+=("$word")
              done
            done
          }

          all_publishable_packages() {
            printf '%s' "$metadata_json" \
              | jq -r '
                . as $m
                | $m.packages[]
                | select((.id as $id | $m.workspace_members | index($id)) and .publish != [])
                | .name
              '
          }

          all_workspace_packages() {
            printf '%s' "$metadata_json" \
              | jq -r '
                . as $m
                | $m.packages[]
                | select(.id as $id | $m.workspace_members | index($id))
                | .name
              '
          }

          package_version() {
            local package="$1"
            printf '%s' "$metadata_json" \
              | jq -er --arg package "$package" '
                . as $m
                | $m.packages[]
                | select(.name == $package and (.id as $id | $m.workspace_members | index($id)))
                | select(.publish != [])
                | .version
              '
          }

          is_selected_package() {
            local package="$1"
            local selected

            for selected in "${selected_packages[@]}"; do
              if [[ "$selected" == "$package" ]]; then
                return 0
              fi
            done

            return 1
          }

          is_release_package() {
            local package="$1"

            if [[ ${#selected_packages[@]} -gt 0 ]]; then
              is_selected_package "$package"
              return
            fi

            package_version "$package" >/dev/null
          }

          selected_packages_for_checks() {
            if [[ ${#selected_packages[@]} -gt 0 ]]; then
              printf '%s\n' "${selected_packages[@]}"
            else
              all_publishable_packages
            fi
          }

          add_packages <<< "$RELEASE_PACKAGES"

          duplicate_packages="$(selected_packages_for_checks | sort | uniq -d)"
          if [[ -n "$duplicate_packages" ]]; then
            echo "error: duplicate package(s) selected:" >&2
            printf '%s\n' "$duplicate_packages" | sed 's/^/  - /' >&2
            exit 1
          fi

          for package in "${selected_packages[@]}"; do
            if ! package_version "$package" >/dev/null; then
              echo "error: '$package' is not a publishable workspace package" >&2
              echo "publishable packages:" >&2
              all_publishable_packages | sed 's/^/  - /' >&2
              exit 1
            fi
          done

          echo "Selected packages:"
          remaining_packages=()
          already_published_packages=()

          while IFS= read -r package; do
            version="$(package_version "$package")"

            if cargo info --quiet --registry crates-io "${package}@${version}" >/dev/null 2>&1; then
              if [[ "$RELEASE_ALLOW_EXISTING" == "true" ]]; then
                echo "  - $package v$version already exists on crates.io; excluding it."
                already_published_packages+=("$package")
              else
                echo "error: $package v$version already exists on crates.io" >&2
                echo "Bump the version, exclude the package, or use allow_existing to resume a partial publication." >&2
                exit 1
              fi
            else
              echo "  - $package v$version"
              remaining_packages+=("$package")
            fi
          done < <(selected_packages_for_checks)

          if [[ ${#remaining_packages[@]} -eq 0 ]]; then
            echo "All selected crate versions already exist on crates.io."
            exit 0
          fi

          publish_cmd=(cargo publish --workspace --locked)

          while IFS= read -r package; do
            if ! is_release_package "$package"; then
              publish_cmd+=(--exclude "$package")
            fi
          done < <(all_workspace_packages)

          for package in "${already_published_packages[@]}"; do
            publish_cmd+=(--exclude "$package")
          done

          "${publish_cmd[@]}"
