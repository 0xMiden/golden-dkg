name: Zizmor

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/**
  pull_request:
    paths:
      - .github/workflows/**
  schedule:
    - cron: "7 9 * * 1"

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: Audit workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # CodeQL upload-sarif telemetry calls GET /actions/runs/{run_id}
      security-events: write # upload SARIF to the repo's code-scanning view
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install zizmor
        uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2.82.5
        with:
          tool: zizmor
      - name: Run zizmor
        # `--no-exit-codes` so info-level style suggestions (e.g.
        # superfluous-actions on dtolnay/rust-toolchain) don't fail CI.
        # The SARIF is uploaded below for inline UI annotations on the
        # Security tab; that upload is best-effort because private repos
        # without code scanning enabled reject it.
        run: zizmor --pedantic --no-exit-codes --format sarif .github/workflows/ > results.sarif
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: results.sarif
          category: zizmor
