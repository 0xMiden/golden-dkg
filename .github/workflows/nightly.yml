name: Nightly slow tests

on:
  schedule:
    - cron: "17 9 * * *" # 09:17 UTC daily; off the :00 mark to spread load
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  slow-test:
    name: Run #[ignore] slow tests
    runs-on: warp-ubuntu-latest-x64-8x
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: slow-test
      - uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2.82.5
        with:
          tool: cargo-nextest
      - name: Run ignored golden-evrf Secp/Secq tests
        run: cargo nextest run -p golden-evrf --features halo2curves-secp256k1 --run-ignored only
      - name: Run ignored golden-ehtdh1 Secp/Secq bridge test
        run: cargo nextest run -p golden-ehtdh1 --features halo2curves-secp256k1 --run-ignored only
      - name: Run EHTDH1 threshold record example
        run: cargo run -p golden-ehtdh1 --example threshold_records --features halo2curves-secp256k1
